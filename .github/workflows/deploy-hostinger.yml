name: Deploy Sponsor Portal to Hostinger

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Select DEPLOY to start the production deployment.'
        required: true
        type: choice
        options:
          - DO_NOT_DEPLOY
          - DEPLOY
      release_ref:
        description: 'Optional full 40-character commit SHA to deploy or roll back to. Leave blank to deploy this workflow commit.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mirroried-led-sponsor-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Resolve exact release commit
        id: release
        env:
          REQUESTED_REF: ${{ inputs.release_ref }}
        run: |
          set -eu
          REF="$REQUESTED_REF"
          if [ -z "$REF" ]; then REF="$GITHUB_SHA"; fi
          case "$REF" in
            *[!0-9a-fA-F]*) echo 'release_ref must be a full hexadecimal commit SHA'; exit 1 ;;
          esac
          [ "${#REF}" -eq 40 ] || { echo 'release_ref must be exactly 40 hexadecimal characters'; exit 1; }
          echo "value=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved release commit: $REF"

      - name: Validate required deployment configuration
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
          POSTGRES_PASSWORD: ${{ secrets.PORTAL_POSTGRES_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.PORTAL_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.PORTAL_ADMIN_PASSWORD }}
        run: |
          set -eu
          test -n "$HOSTINGER_API_KEY" || { echo 'Missing HOSTINGER_API_KEY secret'; exit 1; }
          test -n "$HOSTINGER_VM_ID" || { echo 'Missing HOSTINGER_VM_ID variable'; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo 'Missing PORTAL_POSTGRES_PASSWORD secret'; exit 1; }
          test -n "$ADMIN_EMAIL" || { echo 'Missing PORTAL_ADMIN_EMAIL variable'; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo 'Missing PORTAL_ADMIN_PASSWORD secret'; exit 1; }

      - name: Validate Hostinger compose file
        env:
          PORTAL_GIT_REF: ${{ steps.release.outputs.value }}
          POSTGRES_DB: mirroried_sponsor_portal
          POSTGRES_USER: mirroried_portal
          POSTGRES_PASSWORD: ${{ secrets.PORTAL_POSTGRES_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.PORTAL_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.PORTAL_ADMIN_PASSWORD }}
          ADMIN_NAME: Mirroried LED Administrator
          APP_ORIGIN: https://sponsors.mirroriedled.com
          TRUST_PROXY: 'true'
          SESSION_HOURS: '8'
          PORT: '3000'
        run: docker compose -f portal/deploy/hostinger-compose.yml config >/dev/null

      - name: Deploy exact release to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: mirroried-led-sponsor-portal
          docker-compose-path: portal/deploy/hostinger-compose.yml
          environment-variables: |
            PORTAL_GIT_REF=${{ steps.release.outputs.value }}
            POSTGRES_DB=mirroried_sponsor_portal
            POSTGRES_USER=mirroried_portal
            POSTGRES_PASSWORD=${{ secrets.PORTAL_POSTGRES_PASSWORD }}
            ADMIN_EMAIL=${{ vars.PORTAL_ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.PORTAL_ADMIN_PASSWORD }}
            ADMIN_NAME=Mirroried LED Administrator
            APP_ORIGIN=https://sponsors.mirroriedled.com
            TRUST_PROXY=true
            SESSION_HOURS=8
            PORT=3000

      - name: Deployment handoff
        run: |
          echo 'Hostinger deployment request submitted.'
          echo 'Release commit: ${{ steps.release.outputs.value }}'
          echo 'Run Sponsor Portal Go-Live Gate only after DNS, domain attachment and HTTPS are active.'
          echo 'For rollback, run this workflow again with a previously known-good 40-character commit SHA.'
