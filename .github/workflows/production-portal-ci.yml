name: Production Marketing Portal CI

on:
  push:
    paths:
      - 'portal/**'
      - '.github/workflows/production-portal-ci.yml'
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/production-portal-ci.yml'

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mirroried_portal_test
          POSTGRES_USER: mirroried_test
          POSTGRES_PASSWORD: mirroried_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirroried_test -d mirroried_portal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependencies
        working-directory: portal
        run: npm install

      - name: Syntax check
        working-directory: portal
        run: npm run check

      - name: Build production Docker image
        working-directory: portal
        run: docker build -t mirroried-led-marketing-portal:ci .

      - name: Apply database migrations
        working-directory: portal
        env:
          DATABASE_URL: postgresql://mirroried_test:mirroried_test_password@127.0.0.1:5432/mirroried_portal_test
        run: npm run db:migrate

      - name: Bootstrap administrator
        working-directory: portal
        env:
          DATABASE_URL: postgresql://mirroried_test:mirroried_test_password@127.0.0.1:5432/mirroried_portal_test
          ADMIN_EMAIL: ci-admin@mirroriedled.test
          ADMIN_PASSWORD: ci-password-very-long-12345
          ADMIN_NAME: CI Administrator
        run: npm run db:bootstrap

      - name: Create advertising test customer
        working-directory: portal
        env:
          DATABASE_URL: postgresql://mirroried_test:mirroried_test_password@127.0.0.1:5432/mirroried_portal_test
          ADVERTISER_NAME: CI Advertising Customer
          ADVERTISER_CONTACT: CI Marketing Manager
          ADVERTISER_EMAIL: ci-advertiser@mirroriedled.test
          ADVERTISER_PASSWORD: ci-advertiser-password-12345
          ADVERTISER_ROLE: advertiser_approver
        run: npm run db:create-advertiser

      - name: Start production API in test mode
        working-directory: portal
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://mirroried_test:mirroried_test_password@127.0.0.1:5432/mirroried_portal_test
          UPLOAD_DIR: /tmp/mirroried-portal-uploads
        run: |
          nohup npm start >/tmp/mirroried-portal.log 2>&1 &
          echo $! >/tmp/mirroried-portal.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 1
          done

      - name: Verify Sponsor Partner admin session
        run: |
          curl -fsS -c /tmp/admin-cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-admin@mirroriedled.test","password":"ci-password-very-long-12345"}' \
            http://127.0.0.1:3000/api/login
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/api/me
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/api/dashboard

      - name: Configure Advertising on the Go inventory
        run: |
          PKG=$(curl -fsS -b /tmp/admin-cookies.txt -H 'Content-Type: application/json' \
            -d '{"name":"CI Two Showroom Tier","description":"CI package","price":500,"maxShowrooms":2}' \
            http://127.0.0.1:3000/api/advertising/admin/packages | jq -r '.item.id')
          SHR1=$(curl -fsS -b /tmp/admin-cookies.txt -H 'Content-Type: application/json' \
            -d '{"name":"CI Trailer 1","publicLabel":"Showroom 1","assetType":"trailer"}' \
            http://127.0.0.1:3000/api/advertising/admin/showrooms | jq -r '.item.id')
          SHR2=$(curl -fsS -b /tmp/admin-cookies.txt -H 'Content-Type: application/json' \
            -d '{"name":"CI Trailer 2","publicLabel":"Showroom 2","assetType":"trailer"}' \
            http://127.0.0.1:3000/api/advertising/admin/showrooms | jq -r '.item.id')
          EVT=$(curl -fsS -b /tmp/admin-cookies.txt -H 'Content-Type: application/json' \
            -d '{"name":"CI Sporting Event","eventDate":"2099-12-31","venue":"CI Stadium","city":"Los Angeles","stateRegion":"CA","status":"public"}' \
            http://127.0.0.1:3000/api/advertising/admin/events | jq -r '.item.id')
          curl -fsS -b /tmp/admin-cookies.txt -H 'Content-Type: application/json' \
            -d "{\"showroomId\":\"$SHR1\",\"adSlotCapacity\":3}" \
            http://127.0.0.1:3000/api/advertising/admin/events/$EVT/showrooms
          curl -fsS -b /tmp/admin-cookies.txt -H 'Content-Type: application/json' \
            -d "{\"showroomId\":\"$SHR2\",\"adSlotCapacity\":3}" \
            http://127.0.0.1:3000/api/advertising/admin/events/$EVT/showrooms
          printf '%s' "$PKG" >/tmp/pkg-id
          printf '%s' "$SHR1" >/tmp/shr1-id
          printf '%s' "$SHR2" >/tmp/shr2-id
          printf '%s' "$EVT" >/tmp/evt-id

      - name: Verify advertiser calendar and two-showroom booking
        run: |
          curl -fsS -c /tmp/advertiser-cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-advertiser@mirroriedled.test","password":"ci-advertiser-password-12345"}' \
            http://127.0.0.1:3000/api/login
          curl -fsS -b /tmp/advertiser-cookies.txt http://127.0.0.1:3000/api/advertising/me
          curl -fsS -b /tmp/advertiser-cookies.txt http://127.0.0.1:3000/api/advertising/packages
          curl -fsS -b /tmp/advertiser-cookies.txt http://127.0.0.1:3000/api/advertising/events
          PKG=$(cat /tmp/pkg-id)
          SHR1=$(cat /tmp/shr1-id)
          SHR2=$(cat /tmp/shr2-id)
          EVT=$(cat /tmp/evt-id)
          BOOKING=$(curl -fsS -b /tmp/advertiser-cookies.txt -H 'Content-Type: application/json' \
            -d "{\"packageId\":\"$PKG\",\"eventId\":\"$EVT\",\"showroomIds\":[\"$SHR1\",\"$SHR2\"],\"campaignName\":\"CI Game Day Campaign\"}" \
            http://127.0.0.1:3000/api/advertising/bookings)
          echo "$BOOKING" | jq -e '.bookingId and .campaignId and .status == "payment-pending"'
          curl -fsS -b /tmp/advertiser-cookies.txt http://127.0.0.1:3000/api/advertising/bookings
          curl -fsS -b /tmp/advertiser-cookies.txt http://127.0.0.1:3000/api/advertising/campaigns

      - name: Print portal log on failure
        if: failure()
        run: cat /tmp/mirroried-portal.log || true
